{% extends "base.html" %}
{% block contenido %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-warning text-dark">
            <h4 class="mb-0"><i class="fas fa-edit me-2"></i>Editar Registro de Mantenimiento</h4>
        </div>
        <div class="card-body">
            <form action="{{ url_for('actualizar_mantenimiento', id_reg=m.id) }}" method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label font-weight-bold">Fecha</label>
                        <input type="date" name="fecha" class="form-control" value="{{ m.fecha_reparacion }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label font-weight-bold">Kilometraje</label>
                        <input type="number" name="km" class="form-control" value="{{ m.km_unidad }}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label font-weight-bold">Tipo de Intervención</label>
                    <select name="tipo" class="form-select" required>
                        <option value="Preventivo" {% if m.tipo_mantenimiento == 'Preventivo' %}selected{% endif %}>Preventivo</option>
                        <option value="Correctivo" {% if m.tipo_mantenimiento == 'Correctivo' %}selected{% endif %}>Correctivo</option>
                        <option value="Cubiertas" {% if m.tipo_mantenimiento == 'Cubiertas' %}selected{% endif %}>Neumáticos</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label font-weight-bold">Descripción</label>
                    <textarea name="descripcion" class="form-control" rows="3" required>{{ m.descripcion }}</textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label font-weight-bold">Proveedor</label>
                        <input type="text" name="proveedor" class="form-control" value="{{ m.proveedor }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label font-weight-bold">Importe ($)</label>
                        <input type="number" step="0.01" name="importe" class="form-control" value="{{ m.importe_total }}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label font-weight-bold">Observaciones Internas</label>
                    <input type="text" name="observaciones" class="form-control" value="{{ m.observaciones }}">
                </div>

                <hr>
                <div class="d-flex justify-content-end">
                    <a href="{{ url_for('ficha_integral_movil', id=m.id_movil) }}" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-warning text-white">Actualizar Registro</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
