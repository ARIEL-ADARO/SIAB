{% extends "base.html" %}
{% block contenido %}
<div class="container mt-4 mb-5">
    <div class="card shadow">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0"><i class="fas fa-edit"></i> Ficha Integral: Móvil {{ movil.nro_unidad }}</h4>
            <span class="badge bg-danger">Perfil Supervisor</span>
        </div>
        <form method="POST" class="card-body">
            <!-- SECCIÓN 1: IDENTIDAD E HISTORIA -->
            <h5 class="text-danger border-bottom pb-2">Identificación e Historia</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <label class="form-label">Número de Móvil</label>
                    <input type="text" name="nro_unidad" class="form-control" value="{{ movil.nro_unidad }}" required>
                    <label class="form-label">KM Iniciales (Compra)</label>
                    <input type="number" name="km_inicial" class="form-control" value="{{ movil.km_inicial }}" placeholder="Km al recibirlo">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Dominio (Patente)</label>
                    <input type="text" name="dominio" class="form-control" value="{{ movil.dominio }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nombre de Homenaje</label>
                    <input type="text" name="nombre_homenaje" class="form-control" value="{{ movil.nombre_homenaje }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Estado del Móvil</label>
                    <select name="estado" class="form-select">
                        <option value="ACTIVO" {% if movil.estado == 'ACTIVO' %}selected{% endif %}>ACTIVO (En Servicio)</option>
                        <option value="REPARACION" {% if movil.estado == 'REPARACION' %}selected{% endif %}>REPARACIÓN (Fuera de Servicio)</option>
                        <option value="HISTORICO" {% if movil.estado == 'HISTORICO' %}selected{% endif %}>HISTÓRICO (Baja del Cuartel)</option>
                    </select>
                </div>
            </div>

            <!-- SECCIÓN 2: DATOS PARA SEGUROS Y LEGALES -->
            <h5 class="text-danger border-bottom pb-2">Seguros y Datos Legales</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label">Compañía Aseguradora</label>
                    <input type="text" name="aseguradora" class="form-control" value="{{ movil.aseguradora }}" placeholder="Nombre del Seguro">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Nro de Chasis</label>
                    <input type="text" name="nro_chasis" class="form-control" value="{{ movil.nro_chasis }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Nro de Motor</label>
                    <input type="text" name="nro_motor" class="form-control" value="{{ movil.nro_motor }}">
                </div>
            </div>

            <!-- SECCIÓN 3: FICHA MECÁNICA Y ORIGEN -->
            <h5 class="text-danger border-bottom pb-2">Ficha Mecánica y Origen</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <label class="form-label">Marca</label>
                    <input type="text" name="marca" class="form-control" value="{{ movil.marca }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Modelo</label>
                    <input type="text" name="modelo" class="form-control" value="{{ movil.modelo }}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Año</label>
                    <input type="number" name="anio" class="form-control" value="{{ movil.anio }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Lugar de Origen</label>
                    <input type="text" name="lugar_origen" class="form-control" value="{{ movil.lugar_origen }}">
                </div>
            </div>

            <!-- SECCIÓN 4: CAPACIDADES Y LOGÍSTICA -->
            <h5 class="text-danger border-bottom pb-2">Capacidades y Logística</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <label class="form-label">Agua (Litros)</label>
                    <input type="number" name="capacidad_agua" class="form-control" value="{{ movil.capacidad_agua }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Vencimiento ITV/VTV</label>
                    <input type="date" name="fecha_vtv" class="form-control" value="{{ movil.fecha_vtv }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Dominio Trailer</label>
                    <input type="text" name="trailer_dominio" class="form-control" value="{{ movil.trailer_dominio }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Ejes Trailer</label>
                    <input type="number" name="trailer_ejes" class="form-control" value="{{ movil.trailer_ejes }}">
                </div>
            </div>

            <div class="mt-4 border-top pt-3 d-flex justify-content-between">
                <div>
                    <a href="/moviles" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-danger px-5">Actualizar Ficha Completa</button>
                </div>
            </div>
        </form>
    </div>

{% endblock %}
