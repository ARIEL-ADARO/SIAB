{% extends "base.html" %}

{% block contenido %}
<div class="container mt-4 mb-5">
    <div class="card shadow border-0">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0"><i class="bi bi-megaphone"></i> Registro de Salida de Emergencia</h4>
        </div>
        <div class="card-body">
            <form action="{{ url_for('nueva_planilla_nexo') }}" method="POST">
                <div class="row g-3 mb-4 p-3 bg-white rounded shadow-sm">
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Nro Parte RUBA</label>
                        <input type="text" name="nro_parte" class="form-control border-danger" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-danger">Tipo de Siniestro (SIAB)</label>
                        <select name="tipo_siniestro_id" class="form-select shadow-sm" required>
                            <option value="">-- Seleccionar Clasificación --</option>
                            {% for t in tipos_siniestros %}
                                <option value="{{ t.id }}">{{ t.nombre_siab }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Fecha</label>
                        <input type="date" name="fecha" value="{{ fecha_hoy }}" class="form-control border-danger">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Hora Salida</label>
                        <input type="time" name="hora_salida" value="{{ hora_hoy }}" class="form-control border-danger">
                    </div>
                </div>

                <div class="table-responsive bg-white rounded shadow-sm">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="text-center" style="width: 80px;">¿Salió?</th>
                                <th>Bombero</th>
                                <th style="width: 200px;">Móvil</th>
                                <th style="width: 250px;">Rol</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for b in bomberos %}
                            <tr class="bombero-row">
                                <td class="text-center">
                                    <input type="checkbox" name="bomberos_seleccionados" value="{{ b.legajo }}" 
                                        class="form-check-input check-bombero" onchange="toggleFila(this)">
                                </td>
                                <td>
                                    <div class="fw-bold text-uppercase">{{ b.apellido }}, {{ b.nombre }}</div>
                                    <small class="text-muted">Legajo: {{ b.legajo }} | {{ b.situacion }}</small>
                                </td>
                                <td>
                                    <select name="movil_{{ b.legajo }}" class="form-select form-select-sm input-hidden" disabled required>
                                        <option value="" disabled selected>Móvil...</option>
                                        
                                        <optgroup label="Pesados">
                                            <option value="Móvil 1">Móvil 1 - Autobomba</option>
                                            <option value="Móvil 2">Móvil 2 - Autobomba</option>
                                            <option value="Móvil 3">Móvil 3 - Autobomba 4x4</option>
                                            <option value="Móvil 4">Móvil 4 - Cisterna</option>
                                        </optgroup>

                                        <optgroup label="Livianos / Logística">
                                            <option value="Móvil 5">Móvil 5 - Traslado Personal</option>
                                            <option value="Móvil 11">Móvil 11 - Pickup Logística</option>
                                            <option value="Móvil 18">Móvil 18 - Semirrígido</option>
                                        </optgroup>

                                        <optgroup label="Forestales">
                                            <option value="Móvil 6">Móvil 6 - Pickup Kit</option>
                                            <option value="Móvil 8">Móvil 8 - Pickup Kit</option>
                                        </optgroup>

                                        <optgroup label="Otros">
                                            <option value="Móvil Propio">Móvil Propio</option>
                                            <option value="Otra Institución">Otra Institución</option>
                                        </optgroup>
                                    </select>
                                </td>
                                <td>
                                    <select name="rol_{{ b.legajo }}" class="form-select form-select-sm input-hidden" disabled>
                                        <option value="OPERATIVO">OPERATIVO</option>
                                        <option value="CHOFER">CHOFER</option>
                                        <option value="JEFE DE DOTACION">JEFE DE DOTACIÓN</option>
                                        <option value="OPERADOR DE RADIO">OPERADOR DE RADIO</option>
                                    </select>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
                <div class="mt-4 d-flex justify-content-end">
                    <button type="submit" class="btn btn-danger btn-lg px-5 shadow">GUARDAR REGISTRO</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function toggleFila(checkbox) {
    // Buscamos la fila (tr) donde está el checkbox
    let fila = checkbox.closest('tr');
    
    // Buscamos todos los elementos con la clase 'input-hidden' dentro de esa fila
    // (el select de móvil y el select de rol)
    let elementos = fila.querySelectorAll('.input-hidden');
    
    elementos.forEach(el => {
        // Si el checkbox está marcado, habilitamos; si no, deshabilitamos
        el.disabled = !checkbox.checked;
        
        // Mejora: Si está marcado, lo hacemos obligatorio para no dejar campos vacíos
        if (checkbox.checked) {
            el.setAttribute('required', 'required');
            fila.classList.add('table-active'); // Un toque visual para resaltar la fila
        } else {
            el.removeAttribute('required');
            el.value = ""; // Limpiamos el valor si se desmarca
            fila.classList.remove('table-active');
        }
    });
}
</script>
{% endblock %}
