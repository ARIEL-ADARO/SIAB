{% extends "base.html" %}

{% block contenido %}
<!-- Mantenemos tus estilos CSS intactos -->
<style>
    .table-responsive { max-height: 70vh; overflow-y: auto; }
    .sticky-header th {
        position: sticky; top: 0;
        background-color: #212529 !important;
        color: #ffc107 !important;
        z-index: 10;
        border-bottom: 5px solid #dc3545 !important;
        padding: 15px; text-align: center;
    }
    .btn-asistencia { width: 100%; margin-bottom: 5px; font-weight: bold; font-size: 0.8rem; }
    .fila-presente { background-color: #e8f5e9 !important; }
    .fila-justificado { background-color: #fffde7 !important; }
    .fila-ausente { background-color: #ffebee !important; opacity: 0.8; }
</style>

<!-- AGREGAMOS ESTA ESTRUCTURA DE COLUMNAS -->
<div class="container-fluid">
    <div class="row">
        <!-- Espacio para el Sidebar (col-2) y el Contenido (col-10) -->
        <div class="col-lg-10 offset-lg-2 col-md-9 offset-md-3 main-content">
            
            <div class="container-fluid mt-3 mb-5">
                <div class="card shadow border-0">
                    <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center py-3">
                        <h4 class="mb-0"><i class="bi bi-fire"></i> SIAB - Registro de Salida</h4>
                        <a href="{{ url_for('listado_siniestros') }}" class="btn btn-outline-light btn-sm">
                            <i class="bi bi-arrow-left"></i> VOLVER
                        </a>
                    </div>
                    
                    <div class="card-body">
                        <form action="{{ url_for('nueva_planilla_nexo') }}" method="POST">
                            
                            <!-- Datos del Siniestro -->
                            <div class="row g-3 mb-4 p-3 bg-white rounded shadow-sm border-start border-danger border-5">
                                
                                <!-- Primera Fila: RUBA, Tipo y Ubicación -->
                                <div class="col-md-2">
                                    <label class="form-label fw-bold small">Nro Parte RUBA</label>
                                    <!-- Cambiado a nro_part_ruba según tu tabla -->
                                    <input type="text" name="nro_part_ruba" class="form-control border-danger" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold small text-danger">Tipo de Siniestro</label>
                                    <!-- Cambiado a tipo_siniestro para guardar el nombre directamente -->
                                    <select name="tipo_siniestro" class="form-select border-danger" required>
                                        <option value="">-- Seleccionar --</option>
                                        {% for t in tipos_siniestros %}
                                            <option value="{{ t.nombre_siab }}">{{ t.nombre_siab }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Ubicación / Lugar</label>
                                    <input type="text" name="lugar" class="form-control border-danger" placeholder="Ej: Calle San Martín 123" required>
                                </div>

                                <!-- Segunda Fila: Fecha, Hora e Instituciones -->
                                <div class="col-md-3">
                                        <label class="form-label fw-bold small">Fecha</label>
                                        <input type="date" name="fecha" id="fecha" class="form-control border-danger" required>
                                    </div>
                                    
                                    <div class="col-md-2">
                                        <label class="form-label fw-bold small">Hora Salida</label>
                                        <input type="time" name="hora_salida" id="hora_salida" class="form-control border-danger" required>
                                    </div>
                                <div class="col-md-7">
                                    <label class="form-label fw-bold small">Intervención de Instituciones</label>
                                    <!-- Usamos la columna 'observaciones' para el nivel de intervención -->
                                    <select name="observaciones" class="form-select border-danger" required>
                                        <option value="No intervino otra institución bomberil" selected>No intervino otra institución bomberil</option>
                                        <option value="Participó otro cuartel">Participó otro cuartel</option>
                                        <option value="Participaron más de un cuartel">Participaron más de un cuartel</option>
                                        <option value="Intervino la Regional">Intervino la Regional</option>
                                        <option value="Intervino Federación">Intervino Federación</option>
                                        <option value="Intervino Confederación">Intervino Confederación</option>
                                        <option value="Intervino una o más brigadas">Intervino una o más brigadas</option>
                                    </select>
                                </div>

                                <!-- Tercera Fila: Comentario General -->
                                <div class="col-md-12">
                                    <label class="form-label fw-bold small">Comentario General / Observaciones Detalladas</label>
                                    <!-- Cambiado a comentario_general según tu tabla -->
                                    <textarea name="comentario_general" class="form-control border-danger" rows="2" 
                                            placeholder="Detalle nombre de otros cuarteles, números de regional o brigadas participantes..."></textarea>
                                </div>
                            </div>

                            <!-- Tabla de Personal Operativo -->
                            <div class="table-responsive bg-white rounded shadow-sm border">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="sticky-header">
                                        <tr>
                                            <th class="text-center" style="width: 280px;">ASISTENCIA</th>
                                            <th>BOMBERO</th>
                                            <th>MÓVIL</th>
                                            <th>ROL</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {% for b in bomberos %}
                                        <tr id="fila_{{ b.legajo }}">
                                            <td>
                                                <div class="btn-group w-100" role="group">
                                                    <!-- SALIÓ: Verde (Presente) -->
                                                    <input type="radio" class="btn-check" name="asistencia_{{ b.legajo }}" 
                                                        id="p_{{ b.legajo }}" value="PRESENTE" onchange="actualizarInterfaz('{{ b.legajo }}', 'PRESENTE')">
                                                    <label class="btn btn-outline-success fw-bold" for="p_{{ b.legajo }}">SALIÓ</label>

                                                    <!-- EN CUARTEL: Azul (Retén/Puntaje) -->
                                                    <input type="radio" class="btn-check" name="asistencia_{{ b.legajo }}" 
                                                        id="c_{{ b.legajo }}" value="EN_CUARTEL" onchange="actualizarInterfaz('{{ b.legajo }}', 'EN_CUARTEL')">
                                                    <label class="btn btn-outline-primary fw-bold" for="c_{{ b.legajo }}">EN CUARTEL</label>

                                                    <!-- LIMPIAR: Gris (Estado Neutro/No asistió) -->
                                                    <input type="radio" class="btn-check" name="asistencia_{{ b.legajo }}" 
                                                        id="n_{{ b.legajo }}" value="AUSENTE" onchange="actualizarInterfaz('{{ b.legajo }}', 'AUSENTE')" checked>
                                                    <label class="btn btn-outline-secondary fw-bold" for="n_{{ b.legajo }}">X</label>
                                                </div>
                                            </td>
                                            <td>
                                                <div class="fw-bold text-uppercase">{{ b.apellido }}, {{ b.nombre }}</div>
                                                <span class="badge bg-dark">Legajo {{ b.legajo }}</span>
                                            </td>
                                            <td>
                                                <select name="movil_{{ b.legajo }}" id="movil_{{ b.legajo }}" class="form-select select-control-{{ b.legajo }}" disabled>
                                                    <option value="" disabled selected>Móvil...</option>
                                                    <option value="Móvil 1">Móvil 1</option>
                                                    <option value="Móvil 43/5">Móvil 43/5</option>
                                                    <option value="Propio">Propio</option>
                                                </select>
                                            </td>
                                            <td>
                                                <select name="rol_{{ b.legajo }}" id="rol_{{ b.legajo }}" class="form-select select-control-{{ b.legajo }}" disabled>
                                                    <option value="BOMBERO">BOMBERO</option>
                                                    <option value="CHOFER">CHOFER</option>
                                                    <option value="JEFE DE DOTACION">JEFE DE DOTACIÓN</option>
                                                    <option value="CUARTELERO">CUARTELERO</option>
                                                </select>
                                            </td>
                                        </tr>
                                        {% endfor %}
                                    </tbody>
                                </table>
                            </div>

                            <div class="mt-4">
                                <button type="submit" class="btn btn-danger btn-lg w-100 py-3 shadow fw-bold">
                                    <i class="bi bi-save"></i> GUARDAR REGISTRO DE SALIDA
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div> <!-- Fin col-10 -->
    </div> <!-- Fin row -->
</div>

<script>
// Corregí el nombre de la clase en el selector para que coincida con el HTML (select-control-)
function actualizarInterfaz(legajo, estado) {
    let fila = document.getElementById('fila_' + legajo);
    let controles = document.querySelectorAll('.select-control-' + legajo);
    
    // Eliminamos clases previas para limpiar el estado visual de la fila
    fila.classList.remove('fila-presente', 'fila-justificado', 'fila-ausente');

    if (estado === 'PRESENTE') {
        // Estilo para quien SALIÓ
        fila.classList.add('fila-presente'); 
        controles.forEach(c => {
            c.disabled = false;
            c.setAttribute('required', 'required');
        });
    } else if (estado === 'EN_CUARTEL') {
        // Estilo para quien queda EN CUARTEL
        fila.classList.add('fila-justificado'); 
        controles.forEach(c => {
            c.disabled = true;
            c.removeAttribute('required');
            c.value = ""; // Limpia la selección de móvil/rol
        });
    } else {
        // Estilo para estado neutro (Botón X)
        fila.classList.add('fila-ausente'); 
        controles.forEach(c => {
            c.disabled = true;
            c.removeAttribute('required');
            c.value = "";
        });
    }
}
document.addEventListener('DOMContentLoaded', function() {
    const ahora = new Date();

    // Ajustar fecha (formato YYYY-MM-DD)
    const anio = ahora.getFullYear();
    const mes = String(ahora.getMonth() + 1).padStart(2, '0');
    const dia = String(ahora.getDate()).padStart(2, '0');
    document.getElementById('fecha').value = `${anio}-${mes}-${dia}`;

    // Ajustar hora (formato HH:MM)
    const horas = String(ahora.getHours()).padStart(2, '0');
    const minutos = String(ahora.getMinutes()).padStart(2, '0');
    document.getElementById('hora_salida').value = `${horas}:${minutos}`;
});
</script>
{% endblock %}
