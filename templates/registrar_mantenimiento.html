{% extends "base.html" %}

{% block contenido %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0"><i class="fas fa-tools me-2"></i>Registrar Mantenimiento</h4>
                    <span class="badge bg-primary">Unidad #{{ movil_preseleccionado['nro_movil'] }}</span>
                </div>
                <div class="card-body bg-light">
                    <!-- El action apunta a TU función: registrar_mantenimiento -->
                    <form action="{{ url_for('registrar_mantenimiento', id_movil=movil_preseleccionado['id_movil']) }}" method="POST">
                        
                        <div class="row">
                            <div class="col-md-4">
                                <label class="form-label">Fecha del Servicio</label>
                                <input type="date" name="fecha" class="form-control" value="{{ fecha_actual }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label font-weight-bold">Kilometraje Actual</label>
                                <input type="number" name="km" class="form-control" value="{{ movil_preseleccionado['km_actual'] }}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Tipo de Intervención</label>
                            <select name="tipo" class="form-select" required>
                                <option value="Preventivo">Preventivo (Service/Aceite)</option>
                                <option value="Correctivo">Correctivo (Reparación)</option>
                                <option value="Cubiertas">Neumáticos</option>
                                <option value="Equipamiento">Nuevo Equipamiento</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Descripción Técnica</label>
                            <textarea name="descripcion" class="form-control" rows="3" placeholder="Detalle el trabajo realizado..." required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label font-weight-bold">Proveedor / Taller</label>
                                <input type="text" name="proveedor" class="form-control" placeholder="Nombre del taller">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label font-weight-bold">Importe Total ($)</label>
                                <input type="number" step="0.01" name="importe" class="form-control" placeholder="0.00">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label font-weight-bold">Próximo Vencimiento</label>
                                <input type="date" name="proximo_vence" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label font-weight-bold">Observaciones Internas</label>
                                <input type="text" name="observaciones" class="form-control" placeholder="Notas adicionales">
                            </div>
                        </div>

                        <hr>
                        <div class="d-flex justify-content-end">
                            <a href="{{ url_for('ficha_integral_movil', id=movil_preseleccionado['id_movil']) }}" class="btn btn-outline-secondary me-2">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="fas fa-save me-1"></i> Guardar en Historial
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
